# Generated by `python spam_analysis.py filters` from analysis/classify.py.
# Do not edit by hand.
#
# Requests for paths that Galaxy never serves, in any HTTP method and with any
# response status (except where noted). One failregex line per category, in
# this order:
#    1. php               PHP scripts (e.g. /wp-content/x.php, /1.php); Galaxy
#                         has none
#    2. wordpress         WordPress paths (/wp-admin, /wp-content, /xmlrpc)
#    3. dotfile           hidden config/VCS files (/.git/config, /.env, /.aws)
#    4. admin_panel       admin panels and known exploit paths (/phpmyadmin,
#                         /cgi-bin, /actuator, /vendor/phpunit)
#    5. server_script     other server-side scripts (.asp, .aspx, .jsp, .cgi)
#    6. traversal         path traversal (../, %2e%2e, double-encoded variants)
#    7. injection         injection payloads (jndi:, <script, UNION SELECT,
#                         /etc/passwd)
#    8. encoded_dot_file  config files requested with an encoded dot
#                         (/api/smtp/smtp%2ejson, keys%2eenv)
#    9. secret_file       keys and credentials (id_rsa, *.pem,
#                         terraform.tfstate, service-account JSON,
#                         docker-compose.yaml)
#   10. misc_probe        misc recon (/containers/json, /ipfs/, /ip)
#   11. archive_probe     backup/archive in the web root (/backup.zip, /db.sql)
#   12. app_probe         generic web-app routes (/graphql, /dashboard,
#                         /.vite/manifest.json, /admin/login); matched only
#                         when the response is 4xx
#
# Not matched on purpose: /api/* paths that merely look unfamiliar. That needs
# a list of real Galaxy routes which goes stale; only scanner signatures are
# matched, including inside /api/ (e.g. /api/.env).
#

[Definition]
failregex = ^<HOST> \S+ \S+ \[[^\]]*\] "[A-Za-z]+ \S*(?i:\.php\d?( |[/?&])).*" \d{3}
            ^<HOST> \S+ \S+ \[[^\]]*\] "[A-Za-z]+ \S*(?i:/(wp-(admin|content|includes|login|json|config|cron)|wordpress|xmlrpc)).*" \d{3}
            ^<HOST> \S+ \S+ \[[^\]]*\] "[A-Za-z]+ \S*(?i:/\.(git|env|aws|svn|hg|ssh|docker|htaccess|htpasswd|ds_store|npmrc|bash_history|vscode|idea)).*" \d{3}
            ^<HOST> \S+ \S+ \[[^\]]*\] "[A-Za-z]+ \S*(?i:/(phpmyadmin|pma|adminer|cgi-bin|boaform|hnap1|actuator|vendor/phpunit|solr|jenkins|manager/html|server-status|telescope|owa/auth|ecp/|remote/login|evox|nmaplowercheck)).*" \d{3}
            ^<HOST> \S+ \S+ \[[^\]]*\] "[A-Za-z]+ \S*(?i:\.(aspx?|jsp|jspx|cgi|cfm|do|action)( |[/?&])).*" \d{3}
            ^<HOST> \S+ \S+ \[[^\]]*\] "[A-Za-z]+ \S*(?i:(\.\./|%%2e%%2e|%%252e|\.\.%%2f)).*" \d{3}
            ^<HOST> \S+ \S+ \[[^\]]*\] "[A-Za-z]+ \S*(?i:(jndi:|%%24%%7bjndi|<script|%%3cscript|union(%%20|\+| )select|/etc/passwd|base64_decode|%%00)).*" \d{3}
            ^<HOST> \S+ \S+ \[[^\]]*\] "[A-Za-z]+ \S*(?i:%%2e(env|php|ya?ml|json|bak|txt|ts|ini|sql|conf|cfg|properties|old|xml)( |[?&])).*" \d{3}
            ^<HOST> \S+ \S+ \[[^\]]*\] "[A-Za-z]+ \S*(?i:/(id_(rsa|dsa|ecdsa|ed25519)|[^/?]*\.(pem|key|p12|pfx|tfstate)|[^/?]*(credentials|service[-_]?account[^/?]*|serviceaccountkey|firebase[^/?]*|secrets?)\.(json|ya?ml)|rclone\.conf|\.boto|\.s3cfg|docker-compose\.ya?ml|dockerfile)( |\?)).*" \d{3}
            ^<HOST> \S+ \S+ \[[^\]]*\] "[A-Za-z]+ (?i:/(containers/json|ipfs/|ip( |\?))).*" \d{3}
            ^<HOST> \S+ \S+ \[[^\]]*\] "[A-Za-z]+ (?i:/[^/?]*\.(sql|bak|old|zip|tar|tar\.gz|tgz|rar|7z)( |\?)).*" \d{3}
            ^<HOST> \S+ \S+ \[[^\]]*\] "[A-Za-z]+ (?i:/(graphql|v\d+/graphql|api/graphql|(dist/|build/)?\.vite/manifest\.json|(dist|build)/manifest\.json|runtime-config\.js|config\.json|dashboard|portal|workspace|app|signin|account|profile|settings|my|manage|console|admin/login|auth/login)/?( |\?)).*" 4\d\d
ignoreregex =
